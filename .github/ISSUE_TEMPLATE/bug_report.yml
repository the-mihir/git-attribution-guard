name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do **not** open a public issue. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. attribution mode allowlist --local
        2. git commit -m "..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `attribution version`, `attribution status` and `attribution doctor`
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, shell, git version, hook manager (Husky, lefthook, none)
    validations:
      required: true
