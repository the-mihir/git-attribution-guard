name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege: read-only token for every job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          shellcheck --version
          make lint

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Windows (Git Bash) support is best effort until the suite is verified there.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install git-filter-repo (rewrite tests)
        run: pipx install git-filter-repo
      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        run: |
          py="$(command -v python)"
          [ -e "$(dirname "$py")/python3.exe" ] || cp "$py" "$(dirname "$py")/python3.exe"
      - name: Run tests (sh)
        run: sh tests/run.sh
      - name: Run tests (dash)
        if: runner.os == 'Linux'
        run: dash tests/run.sh
