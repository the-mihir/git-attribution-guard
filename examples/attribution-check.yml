# Server-side check for YOUR repositories: copy to .github/workflows/attribution-check.yml
# Local hooks can be skipped (--no-verify, web edits, other machines); this cannot.
# Make it a required status check in branch protection to block merges.
name: Attribution check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAG_VERSION: v1.0.0            # pin a release; bump deliberately
      GAG_REPO: OWNER/git-attribution-guard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-attribution-guard (checksum verified)
        run: |
          set -eu
          v="${GAG_VERSION#v}"
          base="https://github.com/$GAG_REPO/releases/download/$GAG_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/git-attribution-guard-$v.tar.gz"
          curl -fsSLO "$base/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          tar xzf "git-attribution-guard-$v.tar.gz"
          sh "git-attribution-guard-$v/install.sh" --no-skill --no-configure
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure policy
        run: |
          # Same keys as locally. Examples:
          # git config --global attribution.mode allowlist
          # git config --global --add attribution.allow teammate@example.com
          git config --global attribution.mode strip-ai

      - name: Check commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            attribution check "$HEAD"
          else
            attribution check "$BASE..$HEAD"
          fi
